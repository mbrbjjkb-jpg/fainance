name: 投資信託価格 毎日自動巡回・記録システム

on:
  push:
  schedule:
    # ① 日本時間 23:37 (UTC 14:37) -> 1回目の取得（未更新なら静かにスキップ）
    - cron: '37 14 * * *'
    # ② 日本時間 06:37 (UTC 21:37) -> 朝の最終取得（未更新ならエラー終了）
    - cron: '37 21 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. リポジトリ内のファイルをダウンロード（展開）
    - name: コードのチェックアウト
      uses: actions/checkout@v3

    # 2. Python環境をクラウド上にセットアップ
    - name: Python環境のセットアップ
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. 動作に必要な解析ライブラリ（requests、BeautifulSoup4）をインストール
    - name: 依存ライブラリのインストール
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    # 4. 自動取得スクリプトの実行
    - name: 最新の価格データを取得
      env:
        # 朝6:37のスケジュール実行時のみ、プログラムをエラー終了させるフラグを環境変数にセット
        STRICT_MODE: ${{ github.event.schedule == '37 21 * * *' }}
      run: python update_daily_prices.py

    # 5. 変更（追記や確認ログの更新）があった場合のみ、自動コミットしてGitHubにプッシュ
    - name: 変更があった場合はリポジトリを自動更新
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # 記録データ(json)と確認完了フラグ(txt)の両方を監視対象にする
        git add prices_daily.json
        if ! git diff-index --quiet HEAD --; then
          git commit -m "【自動記録】本日の巡回・記録処理が完了しました"
          git push
        else
          echo "本日はすでに処理済み、または変更がないためスキップします。"
        fi

    # 6. エラーが発生した場合のみ、手動再実行（Run workflow）ページへの直通リンクを画面に表示
    - name: 手動再実行リンクの表示（エラー時のみ）
      if: failure() # 直前のステップが失敗（エラー）したときのみ実行されます
      run: |
        echo "### ⚠️ 自動取得エラーが発生しました" >> $GITHUB_STEP_SUMMARY
        echo "最新価格の取得に失敗しました。手動で再実行（Run workflow）を行う場合は、以下のリンクを開いてください。" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "[👉 ここをクリックして手動再実行ページを開く](https://github.com/mbrbjjkb-jpg/fainance/actions/workflows/auto_run.yml)" >> $GITHUB_STEP_SUMMARY
